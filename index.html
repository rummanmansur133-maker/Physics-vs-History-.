<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#000;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

#stars{

position:fixed;
width:100%;
height:100%;
top:0;
left:0;

}

.star{

position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;

}

@keyframes twinkle{

0%{opacity:.2;}

50%{opacity:1;}

100%{opacity:.2;}

}

.center{

text-align:center;
z-index:10;

}

h1{

font-size:50px;

}

p{

font-size:20px;
margin-top:15px;

}

#next{

margin-top:40px;

padding:14px 40px;

border:none;

border-radius:50px;

font-size:18px;

cursor:pointer;

background:#ff2e63;

color:white;

transition:.4s;

}

#next:hover{

transform:scale(1.1);

}

.fade{

animation:fade 2s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body>

<div id="stars"></div>

<div class="center fade">

<h1>A Little Surprise...</h1>

<p>Tap below ❤️</p>

<button id="next">Start</button>

</div>

<script>

const stars=document.getElementById("stars");

for(let i=0;i<250;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*5+"s";

stars.appendChild(s);

}

</script>

</body>

</html>
