<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something Special For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#263b7a,#02020b);
    color:white;
}


/* Galaxy Background */

.galaxy{
    position:absolute;
    width:200%;
    height:200%;
    background-image:
    radial-gradient(white 1px,transparent 1px);
    background-size:50px 50px;
    animation:galaxyMove 35s linear infinite;
    opacity:.5;
}


@keyframes galaxyMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-300px,-300px);
    }
}


/* Stars */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}


@keyframes blink{
    from{
        opacity:.3;
    }
    to{
        opacity:1;
    }
}


/* Shooting Stars */

.shooting{
    position:absolute;
    width:140px;
    height:2px;
    background:
    linear-gradient(90deg,white,transparent);
    transform:rotate(-35deg);
    animation:shoot 3s linear;
}


@keyframes shoot{

0%{
    transform:
    translate(100vw,-20vh)
    rotate(-35deg);
    opacity:0;
}

30%{
    opacity:1;
}

100%{
    transform:
    translate(-20vw,100vh)
    rotate(-35deg);
    opacity:0;
}

}


/* Main */

.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:5;
    padding:20px;
}


.scene{
    display:none;
    animation:cinema 2s ease;
}


.scene.active{
    display:block;
}



@keyframes cinema{

0%{
    opacity:0;
    transform:
    scale(.7)
    translateY(50px);
    filter:blur(10px);
}

100%{
    opacity:1;
    transform:
    scale(1)
    translateY(0);
    filter:blur(0);
}

}



h1{
    font-size:45px;
    text-shadow:
    0 0 25px white;
}


p{
    margin-top:25px;
    font-size:22px;
    line-height:1.7;
}


/* Heart */

.heart{
    font-size:100px;
    animation:pulse 1.5s infinite;
}


@keyframes pulse{

50%{
    transform:scale(1.25);
    filter:
    drop-shadow(0 0 30px red);
}

}



.name{
    margin-top:20px;
    font-size:60px;
    color:#ff9bb5;
}


</style>

</head>


<body>


<div class="galaxy"></div>

<div id="space"></div>


<div class="container">


<!-- Scene 1 -->

<div class="scene active" id="scene1">

<h1>
Something Special For You ✨
</h1>

<p>
A beautiful surprise is waiting for you 🌌
</p>

</div>



<!-- Scene 2 -->

<div class="scene" id="scene2">

<div class="heart">
❤️
</div>


<h1>
For Someone Special...
</h1>


<h2 class="name">
Morium ❤️
</h2>


<p>
You make ordinary moments feel magical ✨
</p>


</div>
