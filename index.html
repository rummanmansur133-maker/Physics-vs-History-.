<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
}

#stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2.5s infinite;
}

@keyframes twinkle{
0%{opacity:.2;}
50%{opacity:1;}
100%{opacity:.2;}
}

.center{
text-align:center;
z-index:100;
animation:fade 2s;
}

h1{
font-size:48px;
letter-spacing:2px;
}

p{
margin-top:20px;
font-size:18px;
opacity:.8;
}

button{
margin-top:40px;
padding:14px 40px;
border:none;
border-radius:50px;
background:#ff2d55;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="center">

<h1>A Little Surprise</h1>

<p>Tap the button ❤️</p>

<button onclick="next()">Start</button>

</div>

<script>

const stars=document.getElementById("stars");

for(let i=0;i<300;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*3+"s";

stars.appendChild(star);

}

function next(){

document.querySelector(".center").innerHTML=`

<h1>✨</h1>

<p style="font-size:26px;">
Something beautiful is about to happen...
</p>

`;

}

</script>

</body>
</html>
