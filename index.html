<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something Special For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#263b7a,#02020b);
    color:white;
}


/* Galaxy Background */

.galaxy{
    position:absolute;
    width:200%;
    height:200%;
    background-image:
    radial-gradient(white 1px,transparent 1px);
    background-size:50px 50px;
    animation:galaxyMove 35s linear infinite;
    opacity:.5;
}


@keyframes galaxyMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-300px,-300px);
    }
}


/* Stars */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}


@keyframes blink{
    from{
        opacity:.3;
    }
    to{
        opacity:1;
    }
}


/* Shooting Stars */

.shooting{
    position:absolute;
    width:140px;
    height:2px;
    background:
    linear-gradient(90deg,white,transparent);
    transform:rotate(-35deg);
    animation:shoot 3s linear;
}


@keyframes shoot{

0%{
    transform:
    translate(100vw,-20vh)
    rotate(-35deg);
    opacity:0;
}

30%{
    opacity:1;
}

100%{
    transform:
    translate(-20vw,100vh)
    rotate(-35deg);
    opacity:0;
}

}


/* Main */

.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:5;
    padding:20px;
}


.scene{
    display:none;
    animation:cinema 2s ease;
}


.scene.active{
    display:block;
}



@keyframes cinema{

0%{
    opacity:0;
    transform:
    scale(.7)
    translateY(50px);
    filter:blur(10px);
}

100%{
    opacity:1;
    transform:
    scale(1)
    translateY(0);
    filter:blur(0);
}

}



h1{
    font-size:45px;
    text-shadow:
    0 0 25px white;
}


p{
    margin-top:25px;
    font-size:22px;
    line-height:1.7;
}


/* Heart */

.heart{
    font-size:100px;
    animation:pulse 1.5s infinite;
}


@keyframes pulse{

50%{
    transform:scale(1.25);
    filter:
    drop-shadow(0 0 30px red);
}

}



.name{
    margin-top:20px;
    font-size:60px;
    color:#ff9bb5;
}


</style>

</head>


<body>


<div class="galaxy"></div>

<div id="space"></div>


<div class="container">


<!-- Scene 1 -->

<div class="scene active" id="scene1">

<h1>
Something Special For You ✨
</h1>

<p>
A beautiful surprise is waiting for you 🌌
</p>

</div>



<!-- Scene 2 -->

<div class="scene" id="scene2">

<div class="heart">
❤️
</div>


<h1>
For Someone Special...
</h1>


<h2 class="name">
Morium ❤️
</h2>


<p>
You make ordinary moments feel magical ✨
</p>


</div>
<!-- Scene 3 -->

<div class="scene" id="scene3">

<h1>
A Little Message For You ❤️
</h1>

<p class="loveText" id="loveMessage"></p>

</div>


</div>



<style>

/* Rose Petals */

.rose{

position:absolute;
top:-50px;
font-size:30px;
animation:fallRose linear infinite;
z-index:2;

}


@keyframes fallRose{

0%{
transform:
translateY(-50px)
rotate(0deg);
opacity:1;
}

100%{
transform:
translateY(110vh)
rotate(360deg);
opacity:0;
}

}


/* Floating Hearts */

.floatHeart{

position:absolute;
bottom:-50px;
font-size:25px;
animation:heartFloat linear infinite;
z-index:3;

}


@keyframes heartFloat{

0%{

transform:
translateY(0)
scale(.5);

opacity:0;

}


30%{

opacity:1;

}


100%{

transform:
translateY(-110vh)
scale(1.5);

opacity:0;

}

}


/* Love Text */

.loveText{

font-size:25px;
color:#ffd6e0;
margin-top:25px;

animation:glowText 2s infinite alternate;

}


@keyframes glowText{

from{

text-shadow:
0 0 5px white;

}

to{

text-shadow:
0 0 30px pink;

}

}


</style>




<script>


// Stars

let space=document.getElementById("space");


for(let i=0;i<150;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";


space.appendChild(star);

}



// Shooting Stars

setInterval(()=>{

let s=document.createElement("div");

s.className="shooting";

s.style.top=Math.random()*60+"%";

space.appendChild(s);


setTimeout(()=>{

s.remove();

},3000);


},2500);




// Scene Change 1 to 2

setTimeout(()=>{

document
.getElementById("scene1")
.classList.remove("active");


document
.getElementById("scene2")
.classList.add("active");


},6000);





// Love Lines

let lines=[

"Your smile makes my world brighter ✨",

"Every moment with you becomes a beautiful memory 🌹",

"You are the special chapter of my story ❤️",

"I don't need a perfect world...",

"I just need a world where you are with me 💖"

];


let line=0;


function showLines(){

if(line < lines.length){

document
.getElementById("loveMessage")
.innerHTML=lines[line];

line++;

setTimeout(showLines,2500);

}

}




// Scene 3

setTimeout(()=>{


document
.getElementById("scene2")
.classList.remove("active");


document
.getElementById("scene3")
.classList.add("active");


showLines();


},13000);






// Falling Roses

setInterval(()=>{


let r=document.createElement("div");

r.className="rose";

r.innerHTML="🌹";


r.style.left=
Math.random()*100+"%";


r.style.animationDuration=
(5+Math.random()*5)+"s";


document.body.appendChild(r);



setTimeout(()=>{

r.remove();

},10000);



},700);






// Floating Hearts

setInterval(()=>{


let h=document.createElement("div");

h.className="floatHeart";

h.innerHTML="❤️";


h.style.left=
Math.random()*100+"%";


h.style.animationDuration=
(5+Math.random()*5)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},10000);



},900);



</script>
<style>

/* Final Proposal */

.bigHeart{

font-size:160px;

animation:bigPulse 1.5s infinite;

filter:
drop-shadow(0 0 45px red);

}


@keyframes bigPulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.3);

}

}



.proposalText{

font-size:40px;

color:#ffd1dc;

margin-top:25px;

text-shadow:
0 0 25px pink;

}



.yesButton{

margin-top:35px;

padding:15px 50px;

border:none;

border-radius:50px;

font-size:22px;

background:#ff3366;

color:white;

cursor:pointer;

box-shadow:
0 0 30px #ff3366;

}




/* Firework */

.particle{

position:absolute;

font-size:30px;

animation:explode 2s forwards;

}



@keyframes explode{

from{

transform:
translate(0,0);

opacity:1;

}


to{

transform:
translate(var(--x),var(--y));

opacity:0;

}

}



.finalScreen{

font-size:30px;

text-align:center;

line-height:1.8;

}


</style>



<!-- Final Scene -->

<div class="scene" id="scene4">


<div class="bigHeart">
❤️
</div>


<h1 class="proposalText">

💍 Will you be mine for life?

</h1>



<button class="yesButton" onclick="acceptLove()">

YES ❤️

</button>


</div>




<script>


// Start Proposal Scene


setTimeout(()=>{


document
.getElementById("scene3")
.classList.remove("active");


document
.getElementById("scene4")
.classList.add("active");


},27000);






function acceptLove(){


document.body.innerHTML=`

<div style="

height:100vh;

background:
radial-gradient(circle,#ff4d6d,#000);

display:flex;

align-items:center;

justify-content:center;

color:white;

padding:20px;

font-family:sans-serif;

">


<div class="finalScreen">


🎉❤️ Morium ❤️🎉

<br><br>


Thank you for being special


<br><br>


I promise to always support you ❤️


<br><br>


✨ Forever Special ✨


</div>


</div>

`;



fireworks();


}




function fireworks(){



for(let i=0;i<100;i++){


let p=document.createElement("div");


p.className="particle";


p.innerHTML="✨";


p.style.left="50%";

p.style.top="50%";



p.style.setProperty(
"--x",
(Math.random()*700-350)+"px"
);



p.style.setProperty(
"--y",
(Math.random()*700-350)+"px"
);



document.body.appendChild(p);



}



}


</script>


</body>
</html>
