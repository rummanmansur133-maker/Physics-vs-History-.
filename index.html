<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#020111,#000);
font-family:Arial,sans-serif;
color:#fff;
}
#stars,#hearts{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
}
.star{
position:absolute;
width:2px;
height:2px;
background:#fff;
border-radius:50%;
animation:twinkle 2s infinite;
}
@keyframes twinkle{
0%,100%{opacity:.2}
50%{opacity:1}
}
.heart{
position:absolute;
font-size:18px;
animation:float 8s linear infinite;
opacity:.8;
}
@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-120vh)}
}
.box{
text-align:center;
z-index:10;
padding:20px;
}
h1{
font-size:42px;
margin-bottom:15px;
animation:fade 2s;
}
p{
font-size:20px;
opacity:.9;
animation:fade 3s;
}
button{
margin-top:35px;
padding:14px 40px;
border:none;
border-radius:40px;
background:#ff2d55;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.3s;
}
button:hover{
transform:scale(1.08);
}
@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
.bigHeart{
font-size:90px;
animation:pulse 1.2s infinite;
}
@keyframes pulse{
50%{transform:scale(1.15)}
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="hearts"></div>

<div class="box" id="content">
<h1>A Little Surprise ❤️</h1>
<p>Tap the button</p>
<button onclick="showLove()">Start</button>
</div>

<script>
const stars=document.getElementById("stars");
for(let i=0;i<180;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*2+"s";
stars.appendChild(s);
}

const hearts=document.getElementById("hearts");
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
hearts.appendChild(h);
setTimeout(()=>h.remove(),8000);
},300);

function showLove(){
document.getElementById("content").innerHTML=`
<div class="bigHeart">❤️</div>
<h1>Will you be mine for life?</h1>
<button onclick="celebrate()">Yes 💖</button>
`;
}
function celebrate(){

document.body.innerHTML=`
<style>
body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}
h1{
font-size:42px;
text-align:center;
animation:fade 2s;
}
p{
font-size:22px;
opacity:.9;
}
.c{
position:fixed;
top:-20px;
font-size:20px;
animation:fall 4s linear forwards;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}
@keyframes fade{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}
</style>

<h1>❤️ Thank You ❤️</h1>
<p>You made my heart smile.</p>
`;

for(let i=0;i<180;i++){
let e=document.createElement("div");
e.className="c";
e.innerHTML=Math.random()>0.5?"❤️":"✨";
e.style.left=Math.random()*100+"vw";
e.style.animationDelay=Math.random()*2+"s";
document.body.appendChild(e);
}

}

</script>

</body>
</html>
